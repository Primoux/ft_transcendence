apiVersion: 1

# Notification templates used by the Discord contact point (contactpoints.yml).
# They only read fields of the notification data (.Status, .Alerts...), no $variables,
# so nothing gets expanded by Grafana's provisioning env interpolation.
templates:
  - orgId: 1
    name: mtgdle-discord
    template: |
      {{ define "mtgdle.discord.title" -}}
      [{{ .Status | toUpper }}{{ if eq .Status "firing" }} x{{ .Alerts.Firing | len }}{{ end }}] {{ .CommonLabels.alertname }}
      {{- end }}

      {{ define "mtgdle.discord.message" -}}
      {{ range .Alerts -}}
      {{ if eq .Status "firing" }}🔴{{ else }}🟢{{ end }} **{{ .Labels.alertname }}** ({{ .Labels.severity }})
      {{ .Annotations.summary }}
      {{ with .Annotations.description }}{{ . }}
      {{ end }}{{ with .SilenceURL }}[Silence]({{ . }}){{ end }}

      {{ end -}}
      {{- end }}
