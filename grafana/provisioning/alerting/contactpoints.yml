apiVersion: 1

contactPoints:
  - orgId: 1
    name: discord
    receivers:
      - uid: discord
        type: discord
        settings:
          url: $__env{DISCORD_WEBHOOK_URL}
          title: '{{ template "mtgdle.discord.title" . }}'
          message: '{{ template "mtgdle.discord.message" . }}'
        disableResolveMessage: false
