apiVersion: 1

contactPoints:
  - orgId: 1
    name: discord
    receivers:
      - uid: discord
        type: discord
        settings:
          # Rendered from Vault by vault-agent-grafana (see vault-agent/grafana.hcl).
          url: $__file{/secrets/discord_webhook_url}
          title: '{{ template "mtgdle.discord.title" . }}'
          message: '{{ template "mtgdle.discord.message" . }}'
        disableResolveMessage: false
