apiVersion: 1

# Replaces the whole notification policy tree of the org.
policies:
  - orgId: 1
    receiver: discord
    group_by: [grafana_folder, alertname]
    group_wait: 30s
    group_interval: 5m
    repeat_interval: 4h
    routes:
      # Critical: notify fast and remind every hour while it stays broken.
      - receiver: discord
        object_matchers:
          - [severity, =, critical]
        group_wait: 10s
        group_interval: 1m
        repeat_interval: 1h
      # Warning: falls back to the root timings above.
      - receiver: discord
        object_matchers:
          - [severity, =, warning]
