name: Feature request
description: Suggest a new feature or an improvement
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is missing or annoying today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What you'd like to happen. Mockups or examples welcome.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      multiple: true
      options:
        - Frontend
        - Backend / API
        - Database
        - Infra (Docker, nginx, CI)
        - Monitoring (Grafana, Prometheus, alerting)
  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: Alternatives considered, related issues, subject module it counts towards...
