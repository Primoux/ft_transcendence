services:
  postgres:
    container_name: postgres
    image: postgres:16-alpine3.24@sha256:0cefaabd882e42bcb2a2f3dc56d3ce4770560ba62fd7f197f1a2e008fd5731ab
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 1s
      timeout: 2s
      retries: 10
      start_period: 2s
  backend:
    build: 
      context: ./backend/
      target: prod
    image: backend-prod
    container_name: backend
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - JWT_SECRET=${JWT_SECRET}
    healthcheck:
      test: ["CMD-SHELL", "wget --spider http://localhost:5003/health"]
      interval: 1s
      timeout: 2s
      retries: 10
      start_period: 10s
    depends_on:
      postgres:
        condition: service_healthy
  card-ingestion:
    build: ./backend/
    container_name: card-ingestion
    command: npm run cards:ingest
    environment:
      - DATABASE_URL=${DATABASE_URL}
    depends_on:
      postgres:
        condition: service_healthy
  frontend:
    build: 
      context: ./frontend
      target: prod
    image: frontend-prod
    container_name: frontend
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
