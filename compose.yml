services:
  postgres:
    container_name: postgres
    # Creates the exporter's read-only role on first start: see postgres/exporter-role.sh.
    build:
      context: ./postgres/
    image: postgres-prod
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
      EXPORTER_PASSWORD: ${EXPORTER_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      # Over TCP: the temporary server that runs the init scripts only listens on the Unix socket,
      # so Postgres isn't reported healthy before the exporter's role exists.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U ${DB_USER} -d ${DB_NAME}"]
      interval: 1s
      timeout: 2s
      retries: 10
      start_period: 10s
  backend:
    build:
      context: ./backend/
      target: prod
    image: backend-prod
    container_name: backend
    environment:
      - TZ=Europe/Paris
      - DATABASE_URL=postgresql://${DB_USER}:${DB_PASSWORD}@postgres:5432/${DB_NAME}
    healthcheck:
      test: ["CMD-SHELL", "wget --spider http://localhost:5003/health"]
      interval: 1s
      timeout: 2s
      retries: 10
      start_period: 10s
    depends_on:
      postgres:
        condition: service_healthy
      card-ingestion:
        condition: service_completed_successfully
  card-ingestion:
    build:
      context: ./backend/
      target: prod
    image: card-ingestion
    container_name: card-ingestion
    command: npm run cards:ingest
    environment:
      - DATABASE_URL=postgresql://${DB_USER}:${DB_PASSWORD}@postgres:5432/${DB_NAME}
    depends_on:
      postgres:
        condition: service_healthy
  frontend:
    build:
      context: ./frontend
      target: prod
    image: frontend-prod
    container_name: frontend
    # Read by frontend/default.conf.template.
    environment:
      BACKEND: http://backend:5003/
      SSL_PORT: 8443
      SSL_CERT_FILE: /certs/cert.pem
      SSL_CERT_KEY_FILE: /certs/key.pem
      ALLOWED_METHODS: "GET HEAD POST OPTIONS PATCH"
    # HTTPS only: with no HTTP port, browsers that guess the scheme can only pick the right one.
    ports:
      - "8443:8443"
    # Self-signed certificate generated by `make certs`.
    volumes:
      - ./certs:/certs:ro
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      # The image's own check: curls /healthz over HTTPS.
      test: ["CMD-SHELL", "/usr/local/bin/healthcheck"]
      interval: 2s
      timeout: 2s
      retries: 15
      start_period: 10s
  prometheus:
    container_name: prometheus
    image: prom/prometheus:v3.15.1@sha256:fa3302279710be2f21a8301ec17a8b4f2301fd829bd113839b3b6b02b6f191a2
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:9090/-/healthy"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    depends_on:
      backend:
        condition: service_healthy
  grafana:
    container_name: grafana
    image: grafana/grafana:13.3.0@sha256:488984b716c0862639f91a698adbe2862677a5a07bad42da5f03f3030883b205
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards
    depends_on:
      prometheus:
        condition: service_healthy

  postgres-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:v0.20.1@sha256:ac5ec343104fae0e2d84a27bb8d69b38430a11910c5382cad85d478d2bab713e
    container_name: postgres-exporter
    environment:
      DATA_SOURCE_URI: postgres:5432/${DB_NAME}?sslmode=disable
      DATA_SOURCE_USER: postgres_exporter
      DATA_SOURCE_PASS: ${EXPORTER_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  grafana_data:
  prometheus_data:
