services:
  vault:
    profiles: [vault]
  vault-init:
    profiles: [vault]
  vault-agent-postgres:
    profiles: [vault]
  vault-agent-backend:
    profiles: [vault]
  vault-agent-grafana:
    profiles: [vault]
  vault-agent-frontend:
    profiles: [vault]
  vault-agent-postgres-exporter:
    profiles: [vault]
  postgres-exporter:
    environment:
      DATA_SOURCE_USER: ${DB_USER}
      DATA_SOURCE_PASS: ${DB_PASSWORD}
      DATA_SOURCE_PASS_FILE: !reset null
    group_add: !reset []
    volumes: !reset []
    depends_on: !override
      postgres:
        condition: service_healthy
  grafana:
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:?missing from .env, run make env}
      GF_SECURITY_ADMIN_PASSWORD__FILE: !reset null
    volumes: !override
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards
    depends_on: !override
      prometheus:
        condition: service_healthy
  postgres:
    depends_on: !reset {}
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_PASSWORD_FILE: !reset null
    volumes: !override
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
  backend:
    environment: !override
      - DATABASE_URL=postgresql://${DB_USER}:${DB_PASSWORD}@postgres:5432/${DB_NAME}
      - JWT_SECRET=${JWT_SECRET}
    volumes: !reset []
    depends_on: !override
      postgres:
        condition: service_healthy
      card-ingestion:
        condition: service_completed_successfully
    build:
      target: dev
    image: backend-dev
    ports:
      - "127.0.0.1:5003:5003"
    develop:
      watch:
        - action: sync
          path: ./backend/src/
          target: /app/src/
        - action: rebuild
          path: ./backend/package.json
        - action: rebuild
          path: ./backend/package-lock.json
        - action: rebuild
          path: ./backend/tsconfig.json
        - action: rebuild
          path: ./backend/prisma/migrations
        - action: rebuild
          path: ./backend/prisma.config.ts
  card-ingestion:
    environment: !override
      - DATABASE_URL=postgresql://${DB_USER}:${DB_PASSWORD}@postgres:5432/${DB_NAME}
    volumes: !reset []
    depends_on: !override
      postgres:
        condition: service_healthy
  frontend:
    healthcheck: !override
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:5173/"]
      interval: 2s
      timeout: 2s
      retries: 15
      start_period: 10s
    ports: !override
      - "127.0.0.1:5173:5173"
    # Vite serves plain HTTP in dev: no certificate, so no Vault Agent to wait for.
    environment: !reset {}
    group_add: !reset []
    volumes: !reset []
    depends_on: !override
      backend:
        condition: service_healthy
    build:
      target: dev
    image: frontend-dev
    develop:
      watch:
        - action: sync
          path: ./frontend/src
          target: /app/src
        - action: sync
          path: ./frontend/index.html
          target: /app/index.html
        - action: sync
          path: ./frontend/public/
          target: /app/public/
        - action: rebuild
          path: ./frontend/vite.config.ts
        - action: rebuild
          path: ./frontend/tsconfig.json
        - action: rebuild
          path: ./frontend/tsconfig.node.json
        - action: rebuild
          path: ./frontend/tsconfig.app.json
        - action: rebuild
          path: ./frontend/package.json
        - action: rebuild
          path: ./frontend/package-lock.json
